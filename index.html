<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizora TEST</title>
<style>
body{background:#d9d6ff;font-family:Arial;padding:16px}
.box{background:#fff;border-radius:16px;padding:20px;max-width:400px;margin:20px auto;text-align:center}
button{padding:14px 18px;border-radius:999px;border:0;font-weight:800;font-size:16px;width:100%;margin-top:10px;cursor:pointer}
.tab{display:flex;background:#eee;border-radius:999px;padding:4px}
.tab button{flex:1;background:none}
.tab button.on{background:#5a00e6;color:#fff}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-top:10px;font-size:16px;box-sizing:border-box}
#msg{margin-top:12px;padding:12px;border-radius:10px;background:#f4f0ff;font-weight:700;display:none}
#testBtn{background:#FFD700}
</style>
</head>
<body>
<div class="box">
<h1>Quizora AI - TEST</h1>
<p>If taps work, this will respond.</p>
<button id="testBtn" type="button" onclick="testTap()">👆 TAP TEST BUTTON</button>
<div id="msg">Ready</div>
<div class="tab"><button id="tabAdmin" type="button" class="on" onclick="setTab('admin')">Admin</button><button id="tabStudent" type="button" onclick="setTab('student')">Student</button></div>

<div id="adminBox">
<input id="adminUser" placeholder="Admin Username">
<input id="adminPass" type="password" placeholder="Password">
<button type="button" style="background:#7b00ff;color:#fff" onclick="doAdmin()">Enter - Admin →</button>
</div>

<div id="studentBox" style="display:none">
<input id="stuUser" placeholder="Student Username">
<input id="stuPass" type="password" placeholder="Student Password">
<button type="button" style="background:#0066ff;color:#fff" onclick="doStudent()">Login - Student →</button>
<button type="button" style="background:#eee" onclick="doCreate()">Create My Account →</button>
</div>
<p style="font-size:12px;color:#777;margin-top:10px">Admin first time: any username + any password becomes your password.<br>Student: Create account first, then Login with same.</p>
</div>

<div class="box" id="dash" style="display:none">
<h2 id="dashTitle">Welcome!</h2>
<p id="dashText"></p>
<button type="button" style="background:#eee" onclick="doLogout()">Logout</button>
</div>

<script>
function show(m, ok){
  var el = document.getElementById('msg');
  el.style.display = 'block';
  el.textContent = m;
  el.style.background = ok ? '#d4ffd4' : '#f4f0ff';
}
function testTap(){
  var b = document.getElementById('testBtn');
  b.textContent = '✅ JS IS WORKING - TAPS WORK!';
  b.style.background = '#00cc66';
  b.style.color = '#fff';
  show('✅ JavaScript is working. Now try Admin / Student tabs.', true);
}
function setTab(t){
  document.getElementById('tabAdmin').className = t === 'admin' ? 'on' : '';
  document.getElementById('tabStudent').className = t === 'student' ? 'on' : '';
  document.getElementById('adminBox').style.display = t === 'admin' ? 'block' : 'none';
  document.getElementById('studentBox').style.display = t === 'student' ? 'block' : 'none';
  show('You tapped: ' + t + ' tab - it switched!', true);
}
function doAdmin(){
  var u = document.getElementById('adminUser').value.trim();
  var p = document.getElementById('adminPass').value.trim();
  if(!u){ show('❌ Enter Admin Username', false); return; }
  if(!p){ show('❌ Enter Password', false); return; }
  try{
    var saved = localStorage.getItem('q_admin');
    if(!saved){
      localStorage.setItem('q_admin', JSON.stringify({user:u, pass:p}));
      show('✅ Admin created for ' + u + ' - Entering...', true);
      setTimeout(function(){ openDash('Admin: ' + u); }, 500);
      return;
    }
    var data = JSON.parse(saved);
    if(u.toLowerCase() !== data.user.toLowerCase()){ show('❌ Wrong Admin Username. Saved is: ' + data.user, false); return; }
    if(p !== data.pass){ show('❌ Wrong Password for ' + u, false); return; }
    show('✅ Welcome back ' + u, true);
    setTimeout(function(){ openDash('Admin: ' + u); }, 500);
  }catch(e){ show('Error: ' + e.message, false); }
}
function doCreate(){
  var u = document.getElementById('stuUser').value.trim();
  var p = document.getElementById('stuPass').value.trim();
  if(!u || !p){ show('❌ Enter Student Username + Password to create', false); return; }
  try{
    var list = JSON.parse(localStorage.getItem('q_students') || '[]');
    if(list.some(function(s){ return s.name.toLowerCase() === u.toLowerCase(); })){ show('❌ Username exists - choose another', false); return; }
    list.push({name:u, pin:p});
    localStorage.setItem('q_students', JSON.stringify(list));
    show('✅ Student account created for ' + u + ' - Entering...', true);
    setTimeout(function(){ openDash('Student: ' + u); }, 500);
  }catch(e){ show('Error: ' + e.message, false); }
}
function doStudent(){
  var u = document.getElementById('stuUser').value.trim();
  var p = document.getElementById('stuPass').value.trim();
  if(!u || !p){ show('❌ Enter Username + Password', false); return; }
  try{
    var list = JSON.parse(localStorage.getItem('q_students') || '[]');
    var found = null;
    for(var i=0;i<list.length;i++){ if(list[i].name.toLowerCase()===u.toLowerCase() && list[i].pin===p){ found=list[i]; break; } }
    if(!found){ show('❌ Wrong Username/Password. Tap Create My Account if new.', false); return; }
    show('✅ Welcome ' + u, true);
    setTimeout(function(){ openDash('Student: ' + u); }, 500);
  }catch(e){ show('Error: ' + e.message, false); }
}
function openDash(text){
  document.querySelector('.box').style.display = 'none';
  var d = document.getElementById('dash');
  d.style.display = 'block';
  document.getElementById('dashTitle').textContent = 'Welcome!';
  document.getElementById('dashText').textContent = 'You are logged in as ' + text + '. Login works!';
}
function doLogout(){
  document.getElementById('dash').style.display = 'none';
  document.querySelector('.box').style.display = 'block';
  show('Logged out. Login again.', true);
}
show('Ready. Tap TEST BUTTON first.', true);
</script>
</body>
</html>
